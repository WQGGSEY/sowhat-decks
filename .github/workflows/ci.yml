name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.12"
            tests: ""  # whole suite
          # 3.9 is the python3 that ships with macOS: every skill must run there.
          - python-version: "3.9"
            tests: ""  # whole suite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install "python-pptx==1.0.2" pypdfium2 pytest
      - name: Shared library copies are in sync
        run: python tools/sync_lib.py --check
      - name: Tests (render tests skip without LibreOffice)
        run: python -m pytest -q ${{ matrix.tests }}

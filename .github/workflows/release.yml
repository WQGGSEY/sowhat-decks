name: release

# On a version tag (v1.0.0, v1.1.0, ...): run the tests, build one ZIP per skill
# plus one with all four (tools/build_skill_zips.py), and attach them to the
# GitHub Release for that tag. These ZIPs are the install path for the Claude
# apps (upload a skill ZIP in Claude's settings).

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  zips:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install "python-pptx==1.0.2" pypdfium2 pytest
      - name: Shared library copies are in sync
        run: python tools/sync_lib.py --check
      - name: Tests
        run: python -m pytest -q
      - name: Build and check the skill ZIPs
        run: python tools/build_skill_zips.py --out dist
      - name: Attach the ZIPs to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip --clobber
          else
            gh release create "$TAG" dist/*.zip --title "$TAG" --generate-notes
          fi
